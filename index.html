<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VoyageDesk</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/apple-touch-icon-192.png" />
    <meta name="theme-color" content="#D4A843" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VoyageDesk" />
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon-512.png" />
    <!-- M-3 dell'audit del 5 settembre: i font sono ospitati con l'app
         (src/styles/global.css ha le regole @font-face, public/fonts/ i
         file). Il <link rel="stylesheet"> a fonts.googleapis.com — M-6 del
         13 agosto lo aveva reso un <link> invece di un @import proprio per
         essere visto dal preload scanner prima di <body> — mandava comunque
         l'IP di ogni visitatore a un terzo prima di qualunque interazione,
         teneva un dominio esterno sul percorso critico e, da quando il
         service worker mette in cache il guscio (M-1), sarebbe stata
         l'unica risorsa del guscio a mancare da offline.
         `preload` sulle due facce del primo paint (corpo + titoli): Inter
         serve solo al modulo Liste viaggio e arriva quando quel modulo
         monta, senza bloccare nessuno. -->
    <link rel="preload" href="/fonts/dm-sans.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/playfair-display.woff2" as="font" type="font/woff2" crossorigin />
    <!-- I token safe-area (--safe-top/bottom/left/right) stavano qui, in un
         <style> inline. Sono passati in src/styles/global.css: Vite lo emette
         come <link> in questo stesso <head>, quindi valgono ancora prima del
         primo paint e anche per le schermate montate fuori dall'app (login,
         reset password, ErrorBoundary) — ma smettono di richiedere
         'unsafe-inline' agli <style> nella CSP (M-1, vedi vercel.json). Questo
         file non ha più CSS proprio: se ne servisse, va in global.css. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
