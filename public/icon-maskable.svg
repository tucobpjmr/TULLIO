<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Sfondo navy full-bleed (nessun bordo arrotondato: è il sistema che applica la maschera) -->
  <rect width="512" height="512" fill="#0F2044"/>
  <!-- Contenuto scalato al 65% per restare dentro la safe zone dell'80% (maskable) -->
  <g fill="#D4A843" transform="translate(256,256) scale(0.65) translate(-256,-256)">
    <!-- Fusoliera -->
    <ellipse cx="256" cy="248" rx="24" ry="135"/>
    <!-- Ali principali -->
    <path d="M234,215 L52,338 L76,353 L244,265 L268,265 L436,353 L460,338 L278,215Z"/>
    <!-- Stabilizzatori orizzontali -->
    <path d="M244,344 L168,390 L182,400 L246,370 L266,370 L330,400 L344,390 L268,344Z"/>
  </g>
</svg>
