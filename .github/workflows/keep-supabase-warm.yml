name: Keep Supabase warm

# Il progetto Supabase è sul piano Free: senza traffico per 7 giorni consecutivi
# va in pausa (richiede poi un ripristino manuale dalla dashboard), e anche
# prima di quel limite il compute condiviso può "raffreddarsi" con l'inattività,
# causando qualche secondo di ritardo alla prima richiesta dopo una pausa
# d'uso (es. rientro nell'app dopo la notte). Questo workflow pinga l'API a
# intervalli regolari per tenere l'istanza attiva ed evitare entrambi i casi.
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Il gateway di Supabase vuole l'header apikey su tutte le rotte
      # /auth/v1/*, /health compresa: senza, risponde 401 e `curl -f` esce in
      # errore. Mancava, e questo passo falliva a ogni esecuzione — con due
      # conseguenze, entrambe silenziose: il workflow risultava rosso da
      # giorni, e il ping REST qui sotto non partiva mai, perché un passo
      # fallito ferma i successivi. Cioè il workflow che deve tenere sveglio
      # il progetto non lo stava toccando affatto.
      - name: Ping Auth (GoTrue)
        run: |
          curl -sS -f -o /dev/null "https://vmxvnxsqfisucugcpqlc.supabase.co/auth/v1/health" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZteHZueHNxZmlzdWN1Z2NwcWxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NjcyNjYsImV4cCI6MjA5NjI0MzI2Nn0.HzrIVB-ykHYbOPeA8IH9x-NO3U8Gzc9OqixAVD4noug"

      # Chiave anon pubblica: è la stessa spedita nel bundle frontend a ogni
      # visitatore (protetta dalle policy RLS, non da segretezza), quindi non
      # è un segreto da mettere in un secret di repository.
      #
      # Perché una RPC e non più `/rest/v1/users?select=id&limit=1`: dalla
      # migrazione 20260806170000 il ruolo `anon` non ha più alcun GRANT sulle
      # tabelle di `public` (S-16), quindi quella GET risponderebbe "permission
      # denied" e `curl -f` uscirebbe in errore — il workflow che deve tenere
      # sveglio il progetto tornerebbe rosso senza che nessuno lo abbia
      # toccato, che è esattamente il guasto silenzioso descritto qui sopra per
      # l'header apikey mancante. get_migrazioni_applicate() è concessa ad anon
      # apposta, è STABLE (quindi interrogabile in GET, senza eseguire nulla di
      # volatile) e legge comunque da Postgres, che è lo scopo del ping.
      - name: Ping REST (PostgREST + Postgres)
        run: |
          curl -sS -f -o /dev/null "https://vmxvnxsqfisucugcpqlc.supabase.co/rest/v1/rpc/get_migrazioni_applicate" \
            -H "apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZteHZueHNxZmlzdWN1Z2NwcWxjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODA2NjcyNjYsImV4cCI6MjA5NjI0MzI2Nn0.HzrIVB-ykHYbOPeA8IH9x-NO3U8Gzc9OqixAVD4noug"
