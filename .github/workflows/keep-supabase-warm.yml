name: Keep Supabase warm

# Il progetto Supabase è sul piano Free: senza traffico per 7 giorni consecutivi
# va in pausa (richiede poi un ripristino manuale dalla dashboard), e anche
# prima di quel limite il compute condiviso può "raffreddarsi" con l'inattività,
# causando qualche secondo di ritardo alla prima richiesta dopo una pausa
# d'uso (es. rientro nell'app dopo la notte). Questo workflow pinga l'API a
# intervalli regolari per tenere l'istanza attiva ed evitare entrambi i casi.
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    # B-4 dell'audit del 26 agosto: la chiave anon (pubblica per disegno — è
    # la stessa spedita nel bundle frontend a ogni visitatore, protetta dalle
    # policy RLS e dai GRANT, non dalla segretezza) e l'URL del progetto
    # vivono qui in UNA repository variable invece che ripetuti in chiaro in
    # ogni step: una rotazione (dopo un incidente, o alla scadenza `exp:
    # 2096`) è così una modifica sola invece di cinque, in due file. Sono
    # variable e non secret apposta: una variable è leggibile, ed è corretto
    # che lo sia per un valore che non è un segreto.
    #   Settings → Secrets and variables → Actions → Variables → New
    #     SUPABASE_URL      = https://vmxvnxsqfisucugcpqlc.supabase.co
    #     SUPABASE_ANON_KEY = (la chiave anon del progetto)
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      # Il gateway di Supabase vuole l'header apikey su tutte le rotte
      # /auth/v1/*, /health compresa: senza, risponde 401 e `curl -f` esce in
      # errore. Mancava, e questo passo falliva a ogni esecuzione — con due
      # conseguenze, entrambe silenziose: il workflow risultava rosso da
      # giorni, e il ping REST qui sotto non partiva mai, perché un passo
      # fallito ferma i successivi. Cioè il workflow che deve tenere sveglio
      # il progetto non lo stava toccando affatto.
      - name: Ping Auth (GoTrue)
        run: |
          curl -sS -f -o /dev/null "$SUPABASE_URL/auth/v1/health" -H "apikey: $SUPABASE_ANON_KEY"

      # B-1 dell'audit del 26 agosto: prima pingava get_migrazioni_applicate(),
      # concessa ad anon apposta per questo scopo — ma per un osservatore non
      # autenticato l'elenco dei nomi di migrazione è una mappa della storia di
      # sicurezza del progetto (`fix_users_privilege_escalation`,
      # `revoke_anon_table_grants`...), ricognizione gratuita che non richiede
      # nemmeno un account. ping() non dice nulla e serve identicamente allo
      # scopo di questo workflow: toccare PostgREST e Postgres. Resta STABLE
      # (interrogabile in GET, senza eseguire nulla di volatile) e concessa ad
      # anon — get_migrazioni_applicate() ora non lo è più (vedi la migrazione
      # che la revoca, e verifica-migrazioni.js sul perché quel controllo
      # degrada con garbo invece di rompersi con la revoca).
      - name: Ping REST (PostgREST + Postgres)
        run: |
          curl -sS -f -o /dev/null "$SUPABASE_URL/rest/v1/rpc/ping" -H "apikey: $SUPABASE_ANON_KEY"
