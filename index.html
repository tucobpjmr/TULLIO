<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VoyageDesk</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/apple-touch-icon-192.png" />
    <meta name="theme-color" content="#D4A843" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VoyageDesk" />
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon-512.png" />
    <!-- M-6 dell'audit del 13 agosto: era un @import dentro un <style> che
         un componente React iniettava al mount (oggi src/styles/global.css).
         Un @import in un foglio di stile scoperto solo dopo il mount di React
         parte dopo il bundle JS, il parse e il primo render — un round-trip
         extra e completamente seriale verso fonts.googleapis.com. Un <link>
         nell'HTML iniziale è invece visto dal preload scanner del browser
         prima ancora che il parser raggiunga <body>, e i preconnect qui sotto
         aprono la connessione (DNS+TLS) a googleapis/gstatic in anticipo
         invece di scoprirla solo quando il CSS del font arriva. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <!-- I token safe-area (--safe-top/bottom/left/right) stavano qui, in un
         <style> inline. Sono passati in src/styles/global.css: Vite lo emette
         come <link> in questo stesso <head>, quindi valgono ancora prima del
         primo paint e anche per le schermate montate fuori dall'app (login,
         reset password, ErrorBoundary) — ma smettono di richiedere
         'unsafe-inline' agli <style> nella CSP (M-1, vedi vercel.json). Questo
         file non ha più CSS proprio: se ne servisse, va in global.css. -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
