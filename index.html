<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VoyageDesk</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/apple-touch-icon-192.png" />
    <meta name="theme-color" content="#D4A843" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VoyageDesk" />
    <link rel="apple-touch-icon" sizes="192x192" href="/apple-touch-icon-192.png" />
    <link rel="apple-touch-icon" sizes="512x512" href="/apple-touch-icon-512.png" />
    <!-- M-6 dell'audit del 13 agosto: era un @import dentro il <style> che
         GlobalStyles.jsx inietta a runtime (styles/GlobalStyles.jsx). Un
         @import in un foglio di stile scoperto solo dopo il mount di React
         parte dopo il bundle JS, il parse e il primo render — un round-trip
         extra e completamente seriale verso fonts.googleapis.com. Un <link>
         nell'HTML iniziale è invece visto dal preload scanner del browser
         prima ancora che il parser raggiunga <body>, e i preconnect qui sotto
         aprono la connessione (DNS+TLS) a googleapis/gstatic in anticipo
         invece di scoprirla solo quando il CSS del font arriva. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600&family=Inter:wght@400;500;600;700&display=swap"
    />
    <style>
      /* ─── SAFE AREA (iPhone) ───
         Con viewport-fit=cover + apple-mobile-web-app-status-bar-style
         black-translucent (vedi meta sopra) la web view occupa TUTTO lo schermo,
         status bar (ora, batteria, Dynamic Island) e home indicator compresi:
         senza compensazione le testate finiscono sotto la status bar e i loro
         pulsanti diventano intoccabili.
         I token stanno qui e non nel FontLoader di VoyageDesk.jsx perché servono
         anche alle schermate montate fuori dall'app (login, reset password,
         ErrorBoundary). Valgono 0px dove non c'è una tacca, quindi si sommano
         sempre senza condizionali. */
      :root {
        --safe-top: env(safe-area-inset-top, 0px);
        --safe-bottom: env(safe-area-inset-bottom, 0px);
        --safe-left: env(safe-area-inset-left, 0px);
        --safe-right: env(safe-area-inset-right, 0px);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
