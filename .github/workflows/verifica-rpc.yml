name: Verifica RPC

# Controlla che la produzione sia allineata col repository, su quattro fronti:
# le RPC chiamate dal frontend esistono davvero (S-05, sintomo diretto: senza
# questo, un utente vede "Could not find the function ... in the schema
# cache"); ogni migrazione in supabase/migrations/ risulta applicata (S-05,
# controllo diretto: si accorge anche dello scarto che non tocca nessuna RPC —
# RLS, grant, colonne); gli advisor di sicurezza/performance di Supabase non
# segnalano nulla di livello ERROR; e la allow-list dei Redirect URL di Auth
# non ammette domini di terze parti.
#
# L'ultimo è arrivato per ultimo (C-1 dell'audit del 22 agosto) e non è un
# quarto controllo qualsiasi: è il solo che NON guarda il database, ma un
# valore che vive unicamente nella dashboard Supabase. È esattamente per
# questo che era rimasto senza controllo — tutto ciò che sta in
# supabase/migrations/ aveva già chi lo confrontava con la produzione, ciò che
# sta nella dashboard non aveva nessuno.
#
# Perché serve un workflow a parte e non un passo dentro CI: questi controlli
# interrogano il database di produzione, mentre CI gira anche sulle pull
# request, dove il codice per definizione precede le migrazioni. Una RPC o una
# migrazione nuova aggiunta in una PR risulterebbe "mancante" fino
# all'applicazione, e CI diventerebbe rossa per un motivo giusto ma nel
# momento sbagliato.
#
# Le migrazioni di questo progetto si applicano a mano: lo scarto tra il
# repository e il database non è un caso limite ma una possibilità permanente,
# ed è già successo più volte — vedi scripts/verifica-rpc/index.js per il caso
# che ha originato questo workflow, e scripts/verifica-rpc/migrazioni.js per
# le due migrazioni che il controllo diretto ha trovato già in produzione
# (applicate contestualmente all'aggiunta del controllo stesso).
#
# Perché anche su push a main, e non solo di notte: lo scarto nasce nel momento
# del merge, e main è ciò che Vercel manda in produzione. Con il solo controllo
# giornaliero la finestra di esposizione arriva a 24 ore, ed è la finestra in
# cui l'errore l'ha visto un utente e non noi. Su main essere rossi è il
# risultato giusto al momento giusto: dice che il codice è già live e la
# migrazione no. Sulle pull request resta escluso — lì il codice precede
# legittimamente la migrazione (vedi sopra).
#
# Dopo aver applicato a mano la migrazione che ha fatto scattare l'allarme,
# rilanciare con "Run workflow" (workflow_dispatch): applicare una migrazione
# non tocca il repository, quindi nulla farebbe ripartire il controllo da solo.
on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'supabase/migrations/**'
      - 'scripts/verifica-rpc/**'
      - 'scripts/verifica-advisor/**'
      - 'scripts/verifica-redirect/**'
      - '.github/workflows/verifica-rpc.yml'
  schedule:
    - cron: '30 6 * * *'
  workflow_dispatch: {}

jobs:
  verifica:
    runs-on: ubuntu-latest
    # B-4 dell'audit del 26 agosto: SUPABASE_URL/SUPABASE_ANON_KEY vivevano in
    # chiaro in ognuno dei tre step sotto (tre copie qui, due in
    # keep-supabase-warm.yml — cinque in tutto). La chiave resta pubblica per
    # disegno (protetta da RLS/GRANT, non dalla segretezza: vedi il commento
    # storico che seguiva ogni copia) e va quindi in una repository VARIABLE,
    # non in un secret — le variable sono leggibili, ed è corretto che lo
    # siano. Con questa a livello di job, una rotazione è una modifica sola:
    #   Settings → Secrets and variables → Actions → Variables → New
    #     SUPABASE_URL      = https://vmxvnxsqfisucugcpqlc.supabase.co
    #     SUPABASE_ANON_KEY = (la chiave anon del progetto)
    env:
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      # Nessun `npm ci`: le sonde usano solo moduli nativi di Node.

      # La sonda interroga in GET e non esegue mai nessuna funzione.
      - name: Verifica che le RPC chiamate dal codice esistano
        run: npm run verifica:rpc

      # B-1 dell'audit del 26 agosto: get_migrazioni_applicate() non è più
      # concessa ad anon (l'elenco dei nomi di migrazione, letto da chiunque
      # senza autenticarsi, era ricognizione gratuita sulla storia di
      # sicurezza del progetto). Con la sola chiave anon questo passo è ora
      # strutturalmente inconcludente: vedi il commento in cima a
      # verifica-migrazioni.js sul perché degrada con un avviso invece di
      # rompersi, e su cosa serve per tornare a verificare per davvero.
      - name: Verifica che le migrazioni del repository siano applicate
        if: always()
        run: npm run verifica:migrazioni

      # C-1 dell'audit del 22 agosto. È l'unico controllo che guarda un valore
      # che nel repository NON c'è del tutto — la allow-list dei Redirect URL
      # vive solo nella dashboard Supabase, ed è per questo che ci è rimasto
      # dentro un `*.vercel.app/**` per due mesi senza che nulla lo dicesse.
      # La sonda usa un token deliberatamente invalido: nessuna email parte,
      # nessuna sessione viene emessa, e la risposta non viene mai seguita.
      # Da B-3 dello stesso audit questo comando controlla anche che la CSP di
      # vercel.json non diverga da ORIGIN_PROPRIE — vedi il commento in cima a
      # scripts/verifica-redirect/index.js.
      - name: Verifica che la allow-list dei Redirect URL non ammetta domini terzi
        if: always()
        run: npm run verifica:redirect

      # Richiede il secret SUPABASE_ACCESS_TOKEN (token Management API, non la
      # chiave anon): se non è ancora stato configurato lo script si dichiara
      # inconcludente ed esce 0, non fa fallire il workflow — vedi il commento
      # in cima a scripts/verifica-advisor/index.js per come crearlo.
      - name: Verifica gli advisor di sicurezza e performance di Supabase
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run verifica:advisor

      # M-2 dell'audit del 23 agosto. Stesso token del passo precedente: le
      # soglie di scalabilità del progetto (ST-4 passo 2 su `messages`, e le
      # altre tre) erano condizioni su dati di PRODUZIONE scritte dentro
      # documenti, e nessuno dei controlli esistenti guarda i dati — questo
      # repository sa misurare solo se stesso. Rosso qui non vuol dire «rotto»:
      # vuol dire che una decisione presa quando la tabella era piccola è
      # arrivata al punto in cui era previsto rivederla.
      - name: Verifica le soglie di scalabilità sui volumi di produzione
        if: always()
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run verifica:volumi
